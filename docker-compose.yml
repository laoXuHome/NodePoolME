services:
  nodepool:
    image: ${NODEPOOL_IMAGE:-ghcr.io/laoxuhome/nodepoolme:latest}
    container_name: nodepool
    restart: unless-stopped
    ports:
      - "${NODEPOOL_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NODEPOOL_DATA_DIR: /data
      NODEPOOL_CONFIG_DIR: /config
      NODEPOOL_LOG_DIR: /logs
      NODEPOOL_BACKUP_DIR: /backup
      NODEPOOL_STATE_DIR: /state
      NODEPOOL_MIGRATION_ENABLED: ${NODEPOOL_MIGRATION_ENABLED:-0}
      NODEPOOL_ADMIN_PASSWORD: ${NODEPOOL_ADMIN_PASSWORD:-nodepool}
      NODEPOOL_SECRET: ${NODEPOOL_SECRET:-please-change-this-secret}
      NODEPOOL_TEST_ENGINE: ${NODEPOOL_TEST_ENGINE:-mihomo}
    volumes:
      - ${NODEPOOL_ROOT:-/opt/nodepool}/data:/data
      - ${NODEPOOL_ROOT:-/opt/nodepool}/config:/config
      - ${NODEPOOL_ROOT:-/opt/nodepool}/logs:/logs
      - ${NODEPOOL_ROOT:-/opt/nodepool}/backup:/backup
      - ${NODEPOOL_ROOT:-/opt/nodepool}/state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
