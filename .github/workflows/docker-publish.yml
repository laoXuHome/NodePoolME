name: build-and-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nodepoolme

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx[socks] apscheduler pyyaml python-multipart pytest
      - name: Parser and output tests
        run: |
          python tests/test_parsers.py
          python tests/test_node_params.py
          python tests/test_publish.py
          python tests/test_latency_gate.py
          python tests/test_dashboard_contract.py
          python tests/test_schedule.py
          python tests/test_nodes_api.py
          python tests/test_parser_compat.py
          python tests/test_airport_schedule.py
          python tests/test_settings_bool.py
          python tests/test_airport_toggle.py
          python tests/test_sub_route_queryless.py
          python tests/test_group_global.py
          python tests/test_publish_latency_only.py
          python tests/test_node_filters.py
          python tests/test_required_tags.py
          python tests/test_latency_dual.py
          python tests/test_latency_names.py
          python tests/test_name_separators.py
          python tests/test_node_test_modes.py
          python tests/test_incremental_add.py
          python tests/test_latency_serial.py
          python tests/test_cycle_control.py

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MIHOMO_VERSION=v1.19.34
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bundle amd64 image for offline install
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${{ steps.meta.outputs.version }}"
          IMG="ghcr.io/laoxuhome/nodepoolme:${TAG}"
          docker pull --platform linux/amd64 "$IMG"
          docker save "$IMG" | gzip -9 > "/tmp/nodepoolme-${TAG}-amd64.tar.gz"
          ls -lh /tmp/nodepoolme-*.tar.gz

      - name: Attach bundle to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "NodePoolME ${GITHUB_REF_NAME}" --notes "NodePoolME ${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" /tmp/nodepoolme-*.tar.gz --clobber
