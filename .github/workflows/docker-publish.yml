name: build-and-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nodepoolme

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx[socks] apscheduler pyyaml python-multipart pytest
      - name: Parser and output tests
        run: |
          python tests/test_parsers.py
          python tests/test_node_params.py
          python tests/test_publish.py
          python tests/test_latency_gate.py
          python tests/test_dashboard_contract.py
          python tests/test_schedule.py
          python tests/test_nodes_api.py
          python tests/test_parser_compat.py
          python tests/test_airport_schedule.py
          python tests/test_settings_bool.py
          python tests/test_airport_toggle.py
          python tests/test_sub_route_queryless.py
          python tests/test_group_global.py
          python tests/test_publish_latency_only.py
          python tests/test_node_filters.py
          python tests/test_publish_keyword_filter.py
          python tests/test_latency_dual.py
          python tests/test_latency_names.py
          python tests/test_name_separators.py
          python tests/test_node_test_modes.py
          python tests/test_incremental_add.py
          python tests/test_latency_serial.py
          python tests/test_cycle_control.py
          python tests/test_error_messages_cn.py
          python tests/test_traffic_info.py
          python tests/test_no_node_dedupe.py
          python -m pytest -q

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build amd64 image for smoke test
        run: docker build -t nodepoolme:smoke .

      - name: Run container and exercise core flows
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/nodepool-smoke"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"/{data,config,logs,backup,state}
          docker rm -f nodepool-smoke >/dev/null 2>&1 || true
          docker run -d --name nodepool-smoke --user 0:0 \
            -p 18080:8080 \
            -e TZ=Asia/Shanghai \
            -e NODEPOOL_ADMIN_PASSWORD=smoke-pass \
            -e NODEPOOL_SECRET=smoke-secret-not-for-production \
            -e NODEPOOL_MIGRATION_ENABLED=0 \
            -e NODEPOOL_TEST_ENGINE=mihomo \
            -v "$ROOT/data:/data" \
            -v "$ROOT/config:/config" \
            -v "$ROOT/logs:/logs" \
            -v "$ROOT/backup:/backup" \
            -v "$ROOT/state:/state" \
            nodepoolme:smoke

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18080/healthz | tee /tmp/healthz-first.json
          grep -q '"engine":"mihomo"' /tmp/healthz-first.json

          docker exec nodepool-smoke python /app/scripts/docker_smoke.py | tee /tmp/smoke.json
          grep -q '"result": "PASS"' /tmp/smoke.json

          docker restart nodepool-smoke >/dev/null
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/healthz; then break; fi
            sleep 2
          done
          docker exec -i nodepool-smoke python - <<'PY'
          import sqlite3, sys
          db = sqlite3.connect('/data/nodepool.db')
          airports = db.execute('SELECT COUNT(*) FROM airports').fetchone()[0]
          nodes = db.execute('SELECT COUNT(*) FROM nodes').fetchone()[0]
          baseline = db.execute("SELECT COUNT(*) FROM schema_migrations WHERE status='success'").fetchone()[0]
          db.close()
          print({'airports': airports, 'nodes': nodes, 'baseline_rows': baseline})
          assert airports >= 1 and nodes >= 1 and baseline >= 1
          PY

          docker stop nodepool-smoke >/dev/null
          docker run --rm --user 0:0 \
            -e NODEPOOL_MIGRATION_ENABLED=0 \
            -v "$ROOT/data:/data" -v "$ROOT/config:/config" \
            -v "$ROOT/logs:/logs" -v "$ROOT/backup:/backup" -v "$ROOT/state:/state" \
            nodepoolme:smoke python -m backend.database.cli status --json | tee /tmp/status-after-stop.json
          grep -q '"maintenance": "INACTIVE"' /tmp/status-after-stop.json
          test -n "$(ls -A "$ROOT/backup")"

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs nodepool-smoke || true
          cat /tmp/smoke.json || true

  build:
    needs: [test, smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MIHOMO_VERSION=v1.19.34
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build offline bundle for amd64
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.version }}"
          IMG="ghcr.io/laoxuhome/nodepoolme:${TAG}"
          OUT="/tmp/nodepoolme-${TAG}-offline-amd64"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          docker pull --platform linux/amd64 "$IMG"
          docker save "$IMG" -o "$OUT/nodepoolme-${TAG}-amd64.tar"

          cp docker-compose.yml .env.example README.md Dockerfile upgrade.sh "$OUT/"
          sed "s/<tag>/${TAG}/g" docs/离线部署.md > "$OUT/INSTALL.md"
          cp upgrade.sh /tmp/npup

          tar -C "$OUT" -czf "/tmp/nodepoolme-${TAG}-offline-amd64.tar.gz" .
          (
            cd /tmp
            sha256sum "nodepoolme-${TAG}-offline-amd64.tar.gz" > "nodepoolme-${TAG}-sha256sums.txt"
          )
          ls -lh "/tmp/nodepoolme-${TAG}-offline-amd64.tar.gz" "$OUT/nodepoolme-${TAG}-amd64.tar"

      - name: Attach bundle to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "NodePoolME ${GITHUB_REF_NAME}" --notes "NodePoolME ${GITHUB_REF_NAME}"
          gh release edit "${GITHUB_REF_NAME}" \
            --notes "NodePoolME ${GITHUB_REF_NAME} 离线包（linux/amd64）：nodepoolme-${GITHUB_REF_NAME}-offline-amd64.tar.gz"
          gh release upload "${GITHUB_REF_NAME}" \
            /tmp/nodepoolme-*-offline-amd64.tar.gz \
            /tmp/nodepoolme-*-sha256sums.txt \
            /tmp/npup \
            --clobber
